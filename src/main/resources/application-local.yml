spring:
  application:
    name: administration
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

security:
  internal-gateway:
    enabled: ${INTERNAL_GATEWAY_AUTH_ENABLED:true}
    secret: ${INTERNAL_GATEWAY_SECRET:766SBSZ9soKRmJISfScxyGLDzht}
    max-skew-seconds: ${INTERNAL_GATEWAY_MAX_SKEW_SECONDS:60}
    excluded-paths: ${INTERNAL_GATEWAY_EXCLUDED_PATHS:}

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/